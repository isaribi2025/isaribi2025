  // URLの ?id= を取得
  function getIdFromQuery() {
    const q = new URLSearchParams(window.location.search);
    const s = q.get('id');
    return s ? Number(s) : null;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[m]));
  }

  // --- 簡易サニタイズ関数（外部サービスを使わない実装）
  function sanitizeHTML(input) {
    if (!input) return '';

    // 1) <script> を完全に除去
    input = input.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '');

    // 2) DOMParser でパース（実行はされない）
    const parser = new DOMParser();
    const doc = parser.parseFromString(input, 'text/html');

    const allowedTags = new Set(['p','br','b','i','strong','em','ul','ol','li','a']);
    function clean(node) {
      const children = Array.from(node.childNodes);
      for (const child of children) {
        if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.tagName.toLowerCase();
          if (!allowedTags.has(tag)) {
            const parent = child.parentNode;
            while (child.firstChild) {
              parent.insertBefore(child.firstChild, child);
            }
            parent.removeChild(child);
          } else {
            // 属性フィルタリング
            const attrs = Array.from(child.attributes || []);
            for (const a of attrs) {
              const name = a.name.toLowerCase();
              const val = a.value;
              if (name.startsWith('on')) {
                child.removeAttribute(name);
                continue;
              }
              if (/^\s*javascript:/i.test(val) || /^\s*data:/i.test(val)) {
                child.removeAttribute(name);
                continue;
              }
              if (tag === 'a' && name === 'href') {
                if (!/^(https?:|mailto:|tel:)/i.test(val)) {
                  child.removeAttribute('href');
                } else {
                  child.setAttribute('target', '_blank');
                  child.setAttribute('rel', 'noopener noreferrer');
                }
                continue;
              }
              // その他は削除
              child.removeAttribute(name);
            }
            clean(child);
          }
        } else if (child.nodeType === Node.TEXT_NODE) {
          // OK
        } else {
          // コメントなどは削除
          child.parentNode.removeChild(child);
        }
      }
    }

    clean(doc.body);
    return doc.body.innerHTML || '';
  }

  (function () {
    const id = getIdFromQuery();
    const content = document.getElementById('content');

    if (!id) {
      content.innerHTML = '<div class="notfound">無効なIDです。URLに <code>?id=番号</code> を付けてください。</div>';
      return;
    }

    const b = booths.find(x => x.id === id);
    if (!b) {
      content.innerHTML = '<div class="notfound">該当するブースが見つかりません。</div>';
      return;
    }

    // 通常フィールドはエスケープしておく（XSS対策）
    const title = b.title ? escapeHtml(b.title) : '';
    const category = b.category ? escapeHtml(b.category) : '';
    const presenterLocation = b.presenterLocation ? escapeHtml(b.presenterLocation) : '';
    const description = b.description ? escapeHtml(b.description) : '';
    // recommended の HTML 処理
let recommendedHtml = '';
if (b.recommendedHtml) {
  recommendedHtml = sanitizeHTML(b.recommendedHtml);
} else if (b.recommended) {
  // プレーンテキストならエスケープして利用
  recommendedHtml = escapeHtml(b.recommended);
}

    // organizerMessage の有無判定（"なし" の場合は非表示）
    const plainOrganizer = (typeof b.organizerMessage === 'string') ? b.organizerMessage.trim() : null;
    const explicitNone = (plainOrganizer && plainOrganizer === 'なし');

    let organizerMessageHtml = '';
    if (!explicitNone) {
      if (b.organizerMessageHtml) {
        organizerMessageHtml = sanitizeHTML(b.organizerMessageHtml);
      } else if (b.organizerMessage) {
        // プレーンテキストがある場合はエスケープして使う
        organizerMessageHtml = escapeHtml(b.organizerMessage);
      }
    } else {
      // explicitNone === true の場合は必ず非表示（空にしておく）
      organizerMessageHtml = '';
    }

    // ブース運営者セクションを出すかどうか
    const showOrganizerSection = organizerMessageHtml && organizerMessageHtml.trim() !== '';

    // 組み立て（運営者セクションは条件付きで挿入）
    content.innerHTML = `
      <h2 class="title">${title}</h2>
      <div class="meta">カテゴリ: ${category}</div>
      <div class="meta">発表場所: ${presenterLocation}</div>

      <hr style="margin:0.75rem 0;border:none;border-top:1px solid #EEF2FF;">

      <h3 class="subheading">【ブース紹介】</h3>
      <div class="field-content">${description}</div>

      <h3 class="subheading">【こんな人におすすめ！】</h3>
<div class="field-content">${recommendedHtml}</div>

      ${ showOrganizerSection ? `
        <h3 class="subheading">【ブース運営者より】</h3>
        <div class="field-content">${organizerMessageHtml}</div>
      ` : '' }
    `;
  })();
