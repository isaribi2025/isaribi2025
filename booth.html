    }

    .meta {

      margin-bottom: 0.75rem;

      text-align: center;
    }

      font-weight: 800;
      margin: 1rem 0 0.5rem 0;
      text-align: left;
      color: rgba(0,0,0,0.9);
    }

    /* 本文フォント（読みやすく） */
    .field-content {
      line-height: 1.8;
      color: #374151;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      text-align: left;
    }

    .notfound {
      color: #B91C1C;
      font-weight: 700;
      padding: 1rem 0;
    }

    /* カラフルで濃い水玉背景（多め・はっきり） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      /* 複数の radial-gradient を重ねて、多く・濃く・カラフルに */
      background-image:
        radial-gradient(circle at 6% 8%, rgba(75,107,255,0.18) 0 26px, transparent 27px),

        radial-gradient(circle at 40% 6%, rgba(96,194,129,0.14) 0 22px, transparent 23px),
        radial-gradient(circle at 58% 18%, rgba(255,195,70,0.14) 0 28px, transparent 29px),
        radial-gradient(circle at 78% 8%, rgba(153,102,255,0.12) 0 20px, transparent 21px),
        radial-gradient(circle at 10% 60%, rgba(75,107,255,0.12) 0 40px, transparent 41px),
        radial-gradient(circle at 28% 78%, rgba(255,107,165,0.10) 0 30px, transparent 31px),
        radial-gradient(circle at 48% 50%, rgba(255,195,70,0.10) 0 60px, transparent 61px),
        radial-gradient(circle at 66% 62%, rgba(96,194,129,0.10) 0 34px, transparent 35px),
        radial-gradient(circle at 86% 72%, rgba(153,102,255,0.09) 0 26px, transparent 27px),

      background-repeat: no-repeat;
      background-size: cover;
      mix-blend-mode: normal;
    }

    @media (max-width: 640px) {
      .title { font-size: 1.5rem; }
      .field-content { font-size: 0.97rem; }
      body::before {
        /* モバイルではやや小さめに見えるように縮尺変更 */
        background-image:
          radial-gradient(circle at 8% 6%, rgba(75,107,255,0.20) 0 18px, transparent 19px),

          radial-gradient(circle at 60% 10%, rgba(96,194,129,0.14) 0 18px, transparent 19px),

      }
    }
  </style>
</head>

    // URLの ?id= を取得
    function getIdFromQuery() {

      const s = q.get('id');
      return s ? Number(s) : null;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    (function () {
      const id = getIdFromQuery();
      const content = document.getElementById('content');

      if (!id) {

        return;
      }

      const b = booths.find(x => x.id === id);
      if (!b) {
        content.innerHTML = '<div class="notfound">該当するブースが見つかりません。</div>';
        return;
      }

      // 通常フィールドはエスケープしておく（XSS対策）
      const title = b.title ? escapeHtml(b.title) : '';
      const category = b.category ? escapeHtml(b.category) : '';
      const presenterLocation = b.presenterLocation ? escapeHtml(b.presenterLocation) : '';
      const description = b.description ? escapeHtml(b.description) : '';
      const recommended = b.recommended ? escapeHtml(b.recommended) : '';

      // HTMLを含むことを許すフィールド（もし存在すれば sanitize してそのまま使う）
      // ※ DOMPurify が読み込まれている前提（head にスクリプト追加）
      let organizerMessageHtml = '';
      if (b.organizerMessageHtml) {
        if (window.DOMPurify && typeof DOMPurify.sanitize === 'function') {
          organizerMessageHtml = DOMPurify.sanitize(b.organizerMessageHtml, {ALLOWED_TAGS: ['b','i','em','strong','p','br','ul','ol','li','ol','li','a']});
        } else {
          // DOMPurify がない場合は最小限の対応として escape したプレーンテキストを表示
          organizerMessageHtml = escapeHtml(b.organizerMessageHtml);
        }
      } else {
        // 既存のテキストプロパティのみある場合（HTML 非許可）
        organizerMessageHtml = b.organizerMessage ? escapeHtml(b.organizerMessage) : '';
      }
