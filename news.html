<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ニュース詳細</title>

  <style>
    /* 指定フォント（明朝系） */
    body {
      font-family: "游明朝", "Yu Mincho", "Hiragino Mincho ProN", "MS PMincho", serif;
      padding: 2rem;
      background: #fff;
      color: #111;
      position: relative;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 2; /* 背景の水玉より前に */
    }

    a.back {
      display: inline-block;
      margin-bottom: 1rem;
      color: #4B6BFF;
      text-decoration: none;
      font-weight: 600;
    }

    .card {
      border: 1px solid #E6E9F2;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 6px 18px rgba(16, 24, 40, 0.03);
      background-color: rgba(255,255,255,0.96);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: rgba(0,0,0,0.9);
    }

    .meta {
      color: #64748B;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .desc {
      line-height: 1.8;
      color: #374151;
      margin-top: 0.75rem;
      font-size: 1rem;
    }

    .notfound {
      color: #B91C1C;
      font-weight: 700;
      padding: 1rem 0;
    }

    code {
      background: #F8FAFC;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace;
    }

    /* カラフルで濃い水玉背景（多め・はっきり） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 6% 8%, rgba(75,107,255,0.18) 0 26px, transparent 27px),
        radial-gradient(circle at 22% 16%, rgba(255,107,165,0.16) 0 36px, transparent 37px),
        radial-gradient(circle at 40% 6%, rgba(96,194,129,0.14) 0 22px, transparent 23px),
        radial-gradient(circle at 58% 18%, rgba(255,195,70,0.14) 0 28px, transparent 29px),
        radial-gradient(circle at 78% 8%, rgba(153,102,255,0.12) 0 20px, transparent 21px),
        radial-gradient(circle at 10% 60%, rgba(75,107,255,0.12) 0 40px, transparent 41px),
        radial-gradient(circle at 28% 78%, rgba(255,107,165,0.10) 0 30px, transparent 31px),
        radial-gradient(circle at 48% 50%, rgba(255,195,70,0.10) 0 60px, transparent 61px),
        radial-gradient(circle at 66% 62%, rgba(96,194,129,0.10) 0 34px, transparent 35px),
        radial-gradient(circle at 86% 72%, rgba(153,102,255,0.09) 0 26px, transparent 27px),
        radial-gradient(circle at 50% 85%, rgba(75,107,255,0.08) 0 44px, transparent 45px);
      background-repeat: no-repeat;
      background-size: cover;
      mix-blend-mode: normal;
    }

    @media (max-width: 640px) {
      .title { font-size: 1.4rem; }
      .desc { font-size: 0.98rem; }
      body::before {
        background-image:
          radial-gradient(circle at 8% 6%, rgba(75,107,255,0.20) 0 18px, transparent 19px),
          radial-gradient(circle at 28% 12%, rgba(255,107,165,0.18) 0 22px, transparent 23px),
          radial-gradient(circle at 60% 10%, rgba(96,194,129,0.14) 0 18px, transparent 19px),
          radial-gradient(circle at 82% 20%, rgba(255,195,70,0.12) 0 24px, transparent 25px),
          radial-gradient(circle at 50% 70%, rgba(75,107,255,0.09) 0 36px, transparent 37px);
      }
    }

  </style>
</head>

<body>
  <div class="container">
    <a class="back" href="index.html">&larr; 戻る</a>

    <div id="content" class="card">
      <div id="loading">読み込み中…</div>
    </div>
  </div>

  <footer style="text-align:center; font-size:0.8rem; color:#666; margin:2rem; position: relative; z-index:2;">
    <p>最終更新日：2025/12/12</p>
  </footer>

  <script>
    // --- ニュースデータ（ここに追加でニュースを足してください） ---
    const news = [
      {
        id: 6,
        title: "本日開催について※5:00時点",
        date: "2025-12-20",
        category: "お知らせ",
        // HTMLを含む場合は excerptHtml を使う（ここは内包された <p> とリンクを想定）
        excerptHtml: `
          <p>本日、「漁火の会2025」は予定通り開催いたします。
9時00分受付開始、9時45分集合＆開会式開始です。</p><p>寒い予報となっております。暖かい格好で、お気をつけてお越しください。</p>`
      },
      {
        id: 5,
        title: "ブース参加申し込み締め切り延長について",
        date: "2025-12-12",
        category: "お知らせ",
        // HTMLを含む場合は excerptHtml を使う（ここは内包された <p> とリンクを想定）
        excerptHtml: `
          <p>ブースの参加申し込み締め切りは、12/11まででしたが、まだ枠に余裕がありますので、<b><u>12/19の13:00</u></b>までに延長いたします。</p><p>引き続きたくさんのご応募をお待ちしております。</p>
        `
      },
      {
        id: 4,
        title: "ワークショップへの欠席/遅刻/早退連絡について",
        date: "2025-11-15",
        category: "お願い",
        // HTMLを含む場合は excerptHtml を使う（ここは内包された <p> とリンクを想定）
        excerptHtml: `
          <p>ワークショップ①に参加できないなど、欠席/遅刻/早退が事前にわかっている場合は、申し込みフォームの1番最後のページ<b>「漁火の会についての質問や備考 / Question or remarks about the event」</b>の回答にご記入くださいますよう、お願いいたします。</p>
        `
      },
      {
        id: 3,
        title: "Googleフォームの記入について",
        date: "2025-12-02",
        category: "フォーム",
        // HTMLを含む場合は excerptHtml を使う（ここは内包された <p> とリンクを想定）
        excerptHtml: `
          <p>各ブースの参加者を募集しています。申込み締切は12月11日です。こちらのGoogleフォームよりお申し込みください。</p>
          <p><a href="https://forms.gle/KKgWxQY1hShqEPCa8">申し込みフォーム（Googleフォーム）</a></p>
				<p>
				なお回答に際し、以下の点にご注意ください。</p>
				<ul>
    <li>ブースは第4希望まで選択出来ます。</li>
<li><b>「8. 1日アフリカ代表になってみよう！ / Represent an African country for a day!」</b>を選んだ場合<br>→次ページの希望国調査にご回答ください。</li>
<li><b>「8. 1日アフリカ代表になってみよう！ / Represent an African country for a day!」</b>を選んで<b><u>いない</u></b>場合<br>→次ページの希望国調査に回答していただく必要はありません。そのまま「次へ」を押してください。
</li>
<li><b>「6. ビブリオバトル体験-知らない本に出会おう / Biblio battle -Discover a new book-」</b>を選んだ方は、HPのブース紹介欄に載っている持ち物をご確認ください。
</li>
<li>
<b>「7. 地熱発電のイマ、コレカラ。/ The present and future of Geothermal power generation」</b>を選んだ方は、HPのブース紹介欄に載っているリンクより事前アンケートのご協力をお願いいたします。<a href="https://forms.gle/8u1xdW7o5dKkxrEP6">（再掲）事前アンケート（7）</a>
</li>
</ul>
</p>
<p>漁火の会HPでは、随時情報を更新しています。</p>
        `
      },
      {
        id: 2,
        title: "Googleフォームについて",
        date: "2025-11-15",
        category: "募集",
        // HTMLを含む場合は excerptHtml を使う（ここは内包された <p> とリンクを想定）
        excerptHtml: `
          <p>各ブースの参加者を募集しています。申込み締切は12月11日です。こちらのGoogleフォームよりお申し込みください。</p>
          <p><a href="https://forms.gle/KKgWxQY1hShqEPCa8">申し込みフォーム（Googleフォーム）</a></p>
        `
      },
      {
        id: 1,
        title: "漁火の会2025 開催決定！",
        date: "2025-11-10",
        category: "お知らせ",
        // プレーンテキスト例（HTMLタグを含まない）
        excerpt: "漁火の会2025は12月20日に開催いたします。多数のご参加をお待ちしています。"
      }
    ];

    // URL の ?id= を取得
    function getIdFromQuery() {
      const q = new URLSearchParams(window.location.search);
      const s = q.get('id');
      return s ? Number(s) : null;
    }

    // テキスト用エスケープ（XSS対策）
    function escapeHtml(s) {
      return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    // 簡易サニタイズ関数：DOMParser を使って許可タグのみ残す
    // 許可タグ: p, br, b, i, strong, em, ul, ol, li, a, u
    function sanitizeHTML(input) {
      if (!input) return '';
      // 1) <script> を完全に除去
      input = input.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, '');
      // 2) parse
      const parser = new DOMParser();
      const doc = parser.parseFromString(input, 'text/html');
      const allowedTags = new Set(['p','br','b','i','strong','em','ul','ol','li','a','u']);

      function clean(node) {
        const children = Array.from(node.childNodes);
        for (const child of children) {
          if (child.nodeType === Node.ELEMENT_NODE) {
            const tag = child.tagName.toLowerCase();
            if (!allowedTags.has(tag)) {
              // タグを外して中身だけ残す
              const parent = child.parentNode;
              while (child.firstChild) parent.insertBefore(child.firstChild, child);
              parent.removeChild(child);
            } else {
              // 属性フィルタリング
              const attrs = Array.from(child.attributes || []);
              for (const a of attrs) {
                const name = a.name.toLowerCase();
                const val = a.value;
                // on* ハンドラは削除
                if (name.startsWith('on')) {
                  child.removeAttribute(name);
                  continue;
                }
                // javascript:, data: の href は削除
                if (/^\s*javascript:/i.test(val) || /^\s*data:/i.test(val)) {
                  child.removeAttribute(name);
                  continue;
                }
                // a の href は https/http/mailto/tel のみ許可
                if (tag === 'a' && name === 'href') {
                  if (!/^(https?:|mailto:|tel:)/i.test(val)) {
                    child.removeAttribute('href');
                  } else {
                    child.setAttribute('target', '_blank');
                    child.setAttribute('rel', 'noopener noreferrer');
                  }
                  continue;
                }
                // その他の属性は削除（style等も削除）
                child.removeAttribute(name);
              }
              // 再帰
              clean(child);
            }
          } else if (child.nodeType === Node.TEXT_NODE) {
            // テキストはそのまま
          } else {
            // コメントなどは削除
            child.parentNode.removeChild(child);
          }
        }
      }

      clean(doc.body);
      return doc.body.innerHTML || '';
    }

    (function () {
      const id = getIdFromQuery();
      const content = document.getElementById('content');

      if (!id) {
        content.innerHTML = '<div class="notfound">無効なIDです。URLに <code>?id=番号</code> を付けてください。</div>';
        return;
      }

      const item = news.find(x => x.id === id);
      if (!item) {
        content.innerHTML = '<div class="notfound">該当するニュースが見つかりません。</div>';
        return;
      }

      // 表示するフィールドを安全に処理
      const title = item.title ? escapeHtml(item.title) : '';
      const date = item.date ? escapeHtml(item.date) : '';
      const category = item.category ? escapeHtml(item.category) : '';

      // excerptHtml があればサニタイズしてそのまま使う。なければ excerpt(テキスト) をエスケープして <p> で包む
      let bodyHtml = '';
      if (item.excerptHtml) {
        bodyHtml = sanitizeHTML(item.excerptHtml);
      } else if (item.excerpt) {
        bodyHtml = '<p>' + escapeHtml(item.excerpt) + '</p>';
      } else {
        bodyHtml = '<p>本文がありません。</p>';
      }

      // 出力
      content.innerHTML = `
        <div class="title">${title}</div>
        <div class="meta">
			<p>カテゴリ: ${category}</p>
			<p>日付: ${date}</p>
			</div>
        <hr style="margin:0.75rem 0;border:none;border-top:1px solid #EEF2FF;">
        <div class="desc">${bodyHtml}</div>
      `;
    })();
  </script>
</body>
</html>
